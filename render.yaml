# Render Blueprint: New + > Blueprint > pick your GitHub repo.
# Deploys the FastAPI backend (Docker) and a Postgres database.
services:
  - type: web
    name: finance-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-APP.vercel.app   # <- update after deploying the frontend

databases:
  - name: finance-db
    plan: free
